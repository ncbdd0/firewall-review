<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1d2e">
  <title>防火墙复习要塞｜提纲 · 实验背诵与自测</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f1d2e'/%3E%3Cpath d='M12 3.6 18.6 6v5.4c0 4.2-2.8 7.2-6.6 9.1-3.8-1.9-6.6-4.9-6.6-9.1V6L12 3.6Z' fill='none' stroke='%23e8a33d' stroke-width='1.5'/%3E%3Cpath d='M8 10h8M8 13.2h8M8 16.4h8' stroke='%23f2ead6' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div id="app">

  <!-- ================= 访问密码锁定层 ================= -->
  <div class="lock-screen" id="lockScreen" hidden>
    <div class="lock-brick" aria-hidden="true"></div>
    <div class="lock-box">
      <svg class="lock-shield" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.1 20.2 5v6.3c0 5-3.4 8.5-8.2 10.8C7.2 19.8 3.8 16.3 3.8 11.3V5L12 2.1Z"/>
        <path d="M9.4 11.2V9.4a2.6 2.6 0 0 1 5.2 0v1.8"/>
        <rect x="8.1" y="11.2" width="7.8" height="6" rx="1.1"/>
        <path d="M12 13.6v1.8"/>
      </svg>
      <h1 class="lock-title">防火墙复习要塞</h1>
      <p class="lock-sub">FIREWALL REVIEW FORTRESS</p>
      <p class="lock-note">🔒 个人使用 · 内容已加密，请输入访问密码</p>
      <form id="lockForm" autocomplete="off">
        <div class="lock-input-wrap">
          <input type="password" id="lockInput" placeholder="访问密码" autocomplete="current-password" aria-label="访问密码">
        </div>
        <button type="submit" class="lock-btn">解锁要塞</button>
      </form>
      <p class="lock-err" id="lockErr" hidden>密码不正确，请重试</p>
    </div>
  </div>

  <!-- ================= 顶部 ================= -->
  <header class="site-header">
    <div class="header-deco" aria-hidden="true"></div>
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path class="bm-shield" d="M12 2.1 20.2 5v6.3c0 5-3.4 8.5-8.2 10.8C7.2 19.8 3.8 16.3 3.8 11.3V5L12 2.1Z"/>
          <path class="bm-lines" d="M7 9.3h10M7 13.1h10M7 16.9h10"/>
        </svg>
        <div class="brand-text">
          <h1>防火墙复习要塞</h1>
          <p>FIREWALL REVIEW FORTRESS · 提纲 × 实验</p>
        </div>
      </div>
      <nav class="mode-tabs" id="modeTabs" aria-label="模式切换">
        <button class="mode-tab is-active" data-mode="recite" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5A2.5 2.5 0 0 1 20 21.5V5.5Z"/></svg>
          <span>背诵模式</span>
        </button>
        <button class="mode-tab" data-mode="quiz" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" class="fill-dot"/></svg>
          <span>做题模式</span>
        </button>
        <button class="mode-tab" data-mode="kb" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 4l8 3.5-8 3.5-8-3.5Z"/><path d="M4 12l8 3.5L20 12"/><path d="M4 16.5 12 20l8-3.5"/></svg>
          <span>知识库</span>
        </button>
      </nav>
      <button class="hd-lock" id="lockBtn" type="button" title="锁定网站（清除已存密码）" aria-label="锁定网站">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 10.2V8a4.6 4.6 0 0 1 9.2 0v2.2"/><rect x="5.2" y="10.2" width="13.6" height="10" rx="1.6"/><path d="M12 13.6v3.4"/></svg>
        <span>锁定</span>
      </button>
    </div>
    <div class="header-rule" aria-hidden="true"></div>
  </header>

  <!-- ================= 主体 ================= -->
  <main class="main" id="main">

    <!-- ===== 背诵模式 ===== -->
    <section class="view" id="view-recite" aria-label="背诵模式">
      <div class="view-head">
        <div class="row row-bank">
          <div class="segmented" id="reciteBank" role="tablist" aria-label="题库选择">
            <button type="button" data-bank="outline">提纲</button>
            <button type="button" data-bank="experiment">实验</button>
            <button type="button" data-bank="all" class="is-active">双库混背</button>
          </div>
          <button class="ghost-btn" id="reciteHideToggle" type="button" aria-pressed="false">
            <span class="gh-ico">◐</span><span class="gh-txt">遮挡答案</span>
          </button>
        </div>
        <div class="row row-filters">
          <div class="chip-group" id="reciteTypes" aria-label="题型筛选">
            <button type="button" class="chip is-on" data-type="choice">选择</button>
            <button type="button" class="chip is-on" data-type="fill">填空</button>
            <button type="button" class="chip is-on" data-type="term">名词</button>
            <button type="button" class="chip is-on" data-type="short">简答</button>
          </div>
        </div>
        <div class="row row-filters2">
          <div class="select-wrap grow">
            <select id="reciteChapter" aria-label="章节筛选"></select>
          </div>
          <div class="select-wrap">
            <select id="reciteMastery" aria-label="掌握度筛选">
              <option value="all">全部标记</option>
              <option value="none">未标记</option>
              <option value="review">需复习</option>
              <option value="known">已掌握</option>
            </select>
          </div>
        </div>
        <div class="row row-search">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
            <input type="search" id="reciteSearch" placeholder="搜索题目 / 答案关键词…" autocomplete="off">
          </div>
          <span class="count-pill" id="reciteCount">共 0 题</span>
        </div>
      </div>
      <div class="qa-list" id="reciteList"></div>
      <div class="load-more-wrap">
        <button class="ghost-btn" id="reciteMore" type="button" hidden>继续加载 ↓</button>
      </div>
    </section>

    <!-- ===== 做题模式 ===== -->
    <section class="view" id="view-quiz" aria-label="做题模式" hidden>
      <div id="quizStage"></div>
    </section>

    <!-- ===== 知识库 ===== -->
    <section class="view" id="view-kb" aria-label="知识库" hidden>
      <div class="kb-subtabs-wrap">
        <div class="segmented kb-subtabs" id="kbSubtabs" role="tablist" aria-label="知识库子页">
          <button type="button" data-view="kb" class="is-active">📚 原文知识库</button>
          <button type="button" data-view="docs">📁 文档中心</button>
        </div>
      </div>
      <div class="view-head" id="kbControls">
        <div class="row row-bank">
          <div class="segmented" id="kbBank" role="tablist" aria-label="知识库选择">
            <button type="button" data-bank="outline" class="is-active">提纲</button>
            <button type="button" data-bank="experiment">实验</button>
            <button type="button" data-bank="all">双库全览</button>
          </div>
        </div>
        <div class="row row-search">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
            <input type="search" id="kbSearch" placeholder="检索原文内容…" autocomplete="off">
          </div>
          <span class="count-pill" id="kbCount"></span>
        </div>
      </div>
      <div id="kbStage"></div>
      <div id="docsStage" hidden>
        <div class="upload-zone" id="uploadZone" role="button" tabindex="0" aria-label="上传文档">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0 4.5 4.5M12 4 7.5 8.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <p class="uz-main"><b>点击选择</b> 或拖拽文档到此处上传</p>
          <p class="uz-hint">支持 PDF / DOCX / XLSX / PPTX / 图片等 · 存储在本机浏览器，仅自己可见</p>
          <input type="file" id="fileInput" multiple hidden accept=".pdf,.docx,.doc,.xlsx,.xls,.pptx,.ppt,image/*">
        </div>
        <div id="docList"></div>
      </div>
    </section>

  </main>

  <!-- ================= 移动端底部导航 ================= -->
  <nav class="bottom-nav" id="bottomNav" aria-label="模式切换">
    <button class="bn-item is-active" data-mode="recite" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5A2.5 2.5 0 0 1 20 21.5V5.5Z"/></svg>
      <span>背诵</span>
    </button>
    <button class="bn-item" data-mode="quiz" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" class="fill-dot"/></svg>
      <span>做题</span>
    </button>
    <button class="bn-item" data-mode="kb" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 4l8 3.5-8 3.5-8-3.5Z"/><path d="M4 12l8 3.5L20 12"/><path d="M4 16.5 12 20l8-3.5"/></svg>
      <span>知识库</span>
    </button>
  </nav>

  <!-- 文档预览弹层 -->
  <div class="pv-modal" id="pvModal" hidden>
    <div class="pv-head">
      <span class="pv-name" id="pvName"></span>
      <div class="pv-acts">
        <button class="mini-btn" id="pvNew" type="button">↗ 新窗口打开</button>
        <button class="mini-btn" id="pvClose" type="button">✕ 关闭</button>
      </div>
    </div>
    <div class="pv-body" id="pvBody"></div>
  </div>

  <!-- 知识库图片灯箱 -->
  <div class="lightbox" id="lightbox" hidden>
    <img id="lbImg" alt="">
    <p class="lb-hint">点击任意处关闭 · ESC 退出</p>
  </div>

  <!-- 数据加载遮罩 -->
  <div class="boot-mask" id="bootMask">
    <div class="boot-box">
      <svg class="boot-shield" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.1 20.2 5v6.3c0 5-3.4 8.5-8.2 10.8C7.2 19.8 3.8 16.3 3.8 11.3V5L12 2.1Z"/>
        <path d="M7 9.3h10M7 13.1h10M7 16.9h10"/>
      </svg>
      <p>正在部署复习要塞…</p>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>

</div>
<script src="app.js?v=3"></script>
</body>
</html>
